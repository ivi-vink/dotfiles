# Homepage services (https://gethomepage.dev/configs/services/). Seeded into
# /var/lib/homepage on boot by tmpfiles.d/homepage.conf; existing files are
# not overwritten, so edit the live copy at /var/lib/homepage/services.yaml.
- Hub:
    - Calendar:
        href: https://calendar.vinkies.net/admin
        description: Stalwart CalDAV/CardDAV
        icon: stalwart.png
    - VPN:
        href: https://headscale.vinkies.net
        description: Headscale (Tailscale) control server
        icon: tailscale.png
- Local:
    - Calendar:
        href: https://calendar.local.localhost/admin
        description: Stalwart CalDAV/CardDAV
        icon: stalwart.png
    - VPN:
        href: https://headscale.local.localhost
        description: Headscale (Tailscale) control server
        icon: tailscale.png
