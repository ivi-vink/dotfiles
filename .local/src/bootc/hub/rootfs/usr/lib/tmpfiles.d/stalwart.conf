# Stalwart's config.json is written here by the setup wizard on first boot.
# /etc is mutable in bootc; the directory is re-owned at boot because the
# uid/gid are allocated by systemd-sysusers (see sysusers.d/stalwart.conf).
# The baked stalwart.env stays root-owned and readable by the service.
d /etc/stalwart 0750 stalwart stalwart -
