# Homepage's config/state directory, owned by the uid/gid the container runs
# as (PUID/PGID 1000). Homepage writes settings.yaml here, so it lives in
# /var, which bootc keeps untouched across image updates.
d /var/lib/homepage 0755 1000 1000 -

# Seed the image's default config (/usr/share/homepage) into the state
# directory. C copies only files that don't exist yet, so local edits and
# files Homepage creates itself survive image updates.
C /var/lib/homepage/services.yaml 0644 1000 1000 - /usr/share/homepage/services.yaml
C /var/lib/homepage/settings.yaml 0644 1000 1000 - /usr/share/homepage/settings.yaml
