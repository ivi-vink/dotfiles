# /etc/traefik stays owned by root; the traefik group may only read it. The
# uid/gid are allocated at boot by systemd-sysusers, so fix the group then
# rather than in the image. Modes are set in the Containerfile.
Z /etc/traefik - root traefik -
# ACME storage (acme.json); /var is state, kept across image updates. Like
# the radicale directories this is created at boot by systemd-tmpfiles, not
# baked into the image.
d /var/lib/traefik 0750 traefik traefik -
