# Replaces the radicale3 package's tmpfiles.d/radicale.conf (same path, so
# the COPY of rootfs/ overwrites it); the packaged file only covers /run.
# The radicale user is created by systemd-sysusers at boot, which runs before
# systemd-tmpfiles, so the names below resolve then.
d /run/radicale 0755 radicale radicale -
d /var/lib/radicale 0750 radicale radicale -
d /var/cache/radicale 0750 radicale radicale -

# /etc/radicale/rights and users are baked into the image owned by the rpm's
# numeric uid/gid; re-own them to the sysusers-created group at boot. Same
# pattern as tmpfiles.d/traefik.conf.
Z /etc/radicale - root radicale -
