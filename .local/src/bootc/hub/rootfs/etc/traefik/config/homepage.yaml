# Traefik serves the hub over TLS on the websecure entry point (see
# traefik.yaml); this route exposes Homepage as the dashboard for the hub
# hosts and proxies to its podman-published loopback listener. Homepage
# handles its own authentication, so no basicAuth middleware is needed.
# The calendar, VPN and other services live on their own host names, so
# there are no path-prefix overlaps with this route.
http:
  routers:
    homepage:
      rule: "Host(`hub.vinkies.net`)"
      entryPoints:
      - websecure
      service: homepage-local

    homepage-local:
      rule: "Host(`hub.local.localhost`)"
      entryPoints:
      - websecure
      service: homepage-local

  services:
    homepage-local:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3000"
