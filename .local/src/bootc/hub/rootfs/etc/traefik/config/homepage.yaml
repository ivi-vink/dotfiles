# Traefik serves the hub over TLS on the websecure entry point (see
# traefik.yaml); this route exposes Homepage as the dashboard for the hub
# hosts and proxies to its podman-published loopback listener. Homepage
# handles its own authentication, so unlike Radicale no basicAuth middleware
# is needed. The radicale routers have longer rules (Host && PathPrefix), so
# they keep winning for /calendar.
http:
  routers:
    homepage:
      rule: "Host(`hub.vinkies.net`)"
      entryPoints:
      - websecure
      service: homepage-local

    homepage-local:
      rule: "Host(`hub.local.localhost`)"
      entryPoints:
      - websecure
      service: homepage-local

  services:
    homepage-local:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3000"
