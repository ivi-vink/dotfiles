# Traefik serves the hub over TLS on the websecure entry point (see
# traefik.yaml); this route exposes Stalwart under its own host name and
# proxies to its loopback HTTP listener.
#
# Unlike Radicale, Stalwart must be served at the root of a host name: its
# discovery documents contain absolute URLs and CalDAV clients use
# /.well-known/caldav and /.well-known/carddav, so there is no PathPrefix
# and no prefix-stripping middleware. No basicAuth either: Stalwart
# authenticates its own accounts (CalDAV/CardDAV use HTTP Basic directly),
# and the WebUI has its own login.
http:
  routers:
    stalwart:
      rule: "Host(`calendar.vinkies.net`)"
      entryPoints:
      - websecure
      service: stalwart-local

    stalwart-local:
      rule: "Host(`calendar.local.localhost`)"
      entryPoints:
      - websecure
      service: stalwart-local

  services:
    stalwart-local:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8080"
