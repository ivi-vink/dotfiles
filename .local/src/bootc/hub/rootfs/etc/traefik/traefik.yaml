# Static configuration. Entry points must be defined here: they are read once
# at startup and are not part of the dynamic configuration that the file
# provider below loads.
entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    observability:
      accessLogs: true
      metrics: false
      tracing: false

  websecure:
    address: :443
    http:
      tls: {}
        # uncomment for httpChallenge
        # certResolver: le


# Access logs go to stdout in CLF format, which systemd forwards to the
# journal (journalctl -u traefik). CLF includes the authenticated user,
# useful for debugging the basicAuth middleware.
accessLog: {}

# Dynamic configuration (routers, services, certificates) is loaded from here.
providers:
  file:
    directory: "/etc/traefik/config"
