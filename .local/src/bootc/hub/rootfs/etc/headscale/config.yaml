# Headscale configuration for the hub. Only settings that differ from (or
# are required by) the upstream defaults are set; see config-example.yaml in
# the headscale sources. The version is pinned in the Containerfile because
# the config format moves between releases (v0.29 already renames keys).

# The URL clients are told to connect to. There is only one per tailnet:
# nodes reach Traefik on the hub's TLS entry point, so this is the public
# name (Let's Encrypt certificate). The headscale.local.localhost route
# exists for parity, but a client pointed at it needs the hub's self-signed
# root certificate (make trust-cert).
server_url: https://headscale.vinkies.net

# Loopback listeners only; Traefik terminates TLS in front and proxies here
# (see etc/traefik/config/headscale.yaml).
listen_addr: 127.0.0.1:8080
metrics_listen_addr: 127.0.0.1:9090

# gRPC admin API. The local headscale CLI does not use it - it talks to the
# unix socket below - and remote use requires certificates.
grpc_listen_addr: 127.0.0.1:50443

# Honour the X-Forwarded-For/X-Real-IP headers Traefik sets, so nodes'
# last-seen addresses are logged correctly.
trusted_proxies:
  - 127.0.0.1/32

# Tailnet IP ranges (upstream defaults). v0.29 refuses to start without one.
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

# DERP relay map handed to clients (upstream default): Tailscale's public
# DERP servers. headscale refuses to start with an empty map.
derp:
  urls:
    - https://controlplane.tailscale.com/derpmap/default

# State, all under /var/lib/headscale (created by the systemd unit, not
# baked into the image): the SQLite database and the Noise protocol private
# key, generated on first start.
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

noise:
  private_key_path: /var/lib/headscale/noise_private.key

# MagicDNS is on by default since v0.29: nodes resolve as
# <hostname>.tailnet.vinkies.net. The base domain must differ from
# server_url's host.
dns:
  magic_dns: true
  base_domain: tailnet.vinkies.net
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001

# ACLs are stored in the database; until a policy is set, headscale applies
# the default allow-all policy.
policy:
  mode: database

# Socket the headscale CLI uses to administer the tailnet, e.g.
#   headscale users create ivi
#   headscale preauthkeys create --user ivi
unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
